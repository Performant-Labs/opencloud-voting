services:
  opencloud:
    image: opencloudeu/opencloud:latest
    ports:
      - "9200:9200"
    environment:
      OC_INSECURE: "true"
      OC_URL: "https://host.docker.internal:9200"
      IDM_ADMIN_PASSWORD: "admin"
      IDM_CREATE_DEMO_USERS: "true"
    volumes:
      - opencloud-data:/var/lib/opencloud
      - ./web/dist:/var/lib/opencloud/web/assets/apps/feature-voting
    depends_on:
      - voting-api

  voting-api:
    build:
      context: ./api
    ports:
      - "3456:3456"
    environment:
      PORT: "3456"
      DB_PATH: "/data/voting.db"
    volumes:
      - voting-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3456/health"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  opencloud-data:
  voting-data:
