# OpenCloud proxy routing for the Feature Voting extension.
#
# This file is mounted into the OpenCloud container and adds a route
# for the voting API sidecar. The proxy handles OIDC authentication
# and forwards the JWT as X-Access-Token to the sidecar.
#
# Mount via docker-compose:
#   volumes:
#     - ./config/proxy.yaml:/etc/opencloud/proxy.yaml
#
# See: https://docs.opencloud.eu/services/proxy/

additional_policies:
  - name: default
    routes:
      - endpoint: /api/voting/
        backend: http://voting-api:3456
        unprotected: false
        skip_x_access_token: false
